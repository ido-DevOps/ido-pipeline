# Managed by ido-pipeline (onboard.sh). The logic lives in __OWNER__/ido-pipeline — don't edit jobs here;
# change them there once and every project updates. Pinned to __REF__.
name: Pipeline
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 4 * * 0'   # weekly security re-scan of main (new CVEs appear even if code doesn't change)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pipeline-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ci:
    uses: __OWNER__/ido-pipeline/.github/workflows/ci.yml@__REF__
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  conflicts:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: __OWNER__/ido-pipeline/.github/workflows/conflict-guard.yml@__REF__
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
