# Managed by ido-pipeline. Deploys main after a merge, only if CI passed.
# Roll back: Actions → Deploy → Run workflow → enter an older commit SHA.
name: Deploy
on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref: { description: 'Commit SHA or tag to deploy (empty = latest main)', required: false, default: '' }

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: __OWNER__/ido-pipeline/.github/workflows/deploy.yml@__REF__
    with:
      ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      RESTART_CMD: ${{ secrets.RESTART_CMD }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
